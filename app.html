<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Desisaver App – All Video Downloader | Install PWA</title>
  <meta name="description" content="Desisaver App – All-in-one video downloader for Terabox, Instagram, YouTube, Facebook, TikTok and more. Install Desisaver PWA app now." />
  <meta name="keywords" content="desisaver, desisaver app, video downloader app, terabox downloader, instagram video downloader, pwa app" />
  <meta name="robots" content="index, follow" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3248f5" />

  <style>
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:linear-gradient(180deg,#eef2ff,#f9fafb);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    /* FULLSCREEN POPUP */
    .install-overlay{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.92);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }

    .install-box{
      width:90%;
      max-width:420px;
      background:#fff;
      border-radius:22px;
      padding:26px 22px 30px;
      position:relative;
      animation:pop .35s ease;
    }

    @keyframes pop{
      from{transform:scale(.9);opacity:0}
      to{transform:scale(1);opacity:1}
    }

    .close-btn{
      position:absolute;
      top:14px;
      right:14px;
      background:none;
      border:none;
      font-size:22px;
      cursor:pointer;
    }

    .popup-icon{
      width:90px;
      margin-bottom:14px;
    }

    .install-box h2{
      margin:10px 0 6px;
      font-size:24px;
      color:#1e293b;
    }

    .install-box p{
      font-size:14px;
      color:#475569;
      margin-bottom:20px;
    }

    .popup-install-btn{
      width:100%;
      background:#3248f5;
      color:#fff;
      padding:14px;
      font-size:18px;
      font-weight:800;
      border:none;
      border-radius:14px;
      cursor:pointer;
      box-shadow:0 14px 26px rgba(50,72,245,.35);
    }

    .popup-install-btn:active{
      transform:scale(.97);
    }

    .popup-note{
      margin-top:14px;
      font-size:12px;
      color:#64748b;
    }
  </style>
</head>

<body>

<!-- FULL SCREEN INSTALL POPUP -->
<div id="installOverlay" class="install-overlay">
  <div class="install-box">
    <button class="close-btn" id="closePopup">✕</button>

    <img
      src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjkOBtJ_CeVQ48_sLVJWyC4m4VwL4loffbYqIRDMUaJRl8hryiP_1DiRA8TAx6buBWwUTrNsD6k3bmfLKsxjsqdV7PavMcPCi3AzBjKUlbjlCiS8tQcXQrytKLBNZVTlj8IP8wBWhdGyZiY_POfw00N4ZNYlnLRGTD6kFcuwq5awkEtDlMA_1h50QRjSqxN/s1600/icon-192.png"
      alt="Desisaver App"
      class="popup-icon"
    >

    <h2>Install Desisaver App</h2>
    <p>
      Fast • Lightweight • All-in-one Video Downloader<br>
      Works best on Google Chrome (Android)
    </p>

    <button id="popupInstallBtn" class="popup-install-btn">
      📲 Install Now
    </button>

    <div class="popup-note">
      No Play Store • One-tap install
    </div>
  </div>
</div>

<script>
  let deferredPrompt = null;

  const overlay = document.getElementById("installOverlay");
  const installBtn = document.getElementById("popupInstallBtn");
  const closeBtn = document.getElementById("closePopup");

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }

  // Capture PWA install event
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;

    // ⏱ Auto popup after 1 second
    setTimeout(() => {
      overlay.style.display = "flex";
    }, 1000);
  });

  // Real user install click
  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) {
      alert(
        "Install option not available.\n\n" +
        "Chrome menu (⋮) → Add to Home Screen"
      );
      return;
    }

    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    overlay.style.display = "none";
  });

  // Close popup
  closeBtn.addEventListener("click", () => {
    overlay.style.display = "none";
  });
</script>

</body>
</html>
