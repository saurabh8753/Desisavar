<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desisavar</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3248f5">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  *{box-sizing:border-box}

  body{
    margin:0;
    font-family: Inter, Arial, sans-serif;
    background:linear-gradient(180deg,#e8ecff,#f8f9ff);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{
    width:100%;
    padding:18px 0;
    background:#3248f5;
    color:#fff;
    text-align:center;
    font-size:22px;
    font-weight:800;
    letter-spacing:.3px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
  }

  .wrapper{
    width:100%;
    max-width:520px;
    padding:20px 14px 80px;
  }

  .card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-radius:12px;
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    position:relative;
    overflow:hidden;
    transition:.25s;
  }

  .btn i{font-size:18px}

  .btn::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:12px;
    box-shadow:0 0 0 0 rgba(255,255,255,.6);
    opacity:0;
    transition:.35s ease;
  }

  .btn:hover{transform:translateY(-2px) scale(1.01)}
  .btn:hover::after{opacity:1;box-shadow:0 0 18px 4px rgba(255,255,255,.7)}

  .terabox{background:#5b6bff}
  .instagram{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
  .youtube{background:#ff0000}
  .facebook{background:#1877f2}
  .twitter{background:#000000}
  .tiktok{background:#111}
  .snapchat{background:#fffc00;color:#000}
  .pinterest{background:#e60023}
  .whatsapp{background:#25D366}
  .telegram{background:#229ED9}
</style>
</head>

<body>

<header>Desisavar</header>

<div class="wrapper">
  <div class="card">

    <a class="btn terabox" href="javascript:void(0)" data-link="https://1024teradownloader.com/">
      <i class="fa-solid fa-cloud-arrow-down"></i>
      Terabox Video Downloader
    </a>

    <a class="btn instagram" href="javascript:void(0)" data-link="https://igram.world">
      <i class="fa-brands fa-instagram"></i>
      Instagram Video Downloader
    </a>

    <a class="btn youtube" href="javascript:void(0)" data-link="https://turboscribe.ai/downloader/youtube/video">
      <i class="fa-brands fa-youtube"></i>
      YouTube Video Downloader
    </a>

    <a class="btn facebook" href="javascript:void(0)" data-link="https://snapsave.app/">
      <i class="fa-brands fa-facebook-f"></i>
      Facebook Video Downloader
    </a>

    <a class="btn twitter" href="javascript:void(0)" data-link="https://sssx.io/">
      <i class="fa-brands fa-x-twitter"></i>
      Twitter (X) Downloader
    </a>

    <a class="btn tiktok" href="javascript:void(0)" data-link="https://ssstik.io/in">
      <i class="fa-brands fa-tiktok"></i>
      TikTok Video Downloader
    </a>

    <a class="btn snapchat" href="javascript:void(0)" data-link="https://postsyncer.com/tools/snapchat-video-downloader">
      <i class="fa-brands fa-snapchat"></i>
      Snapchat Video Downloader
    </a>

    <a class="btn pinterest" href="javascript:void(0)" data-link="https://pindown.io/en1">
      <i class="fa-brands fa-pinterest"></i>
      Pinterest Video Downloader
    </a>

    <a class="btn whatsapp" href="javascript:void(0)" data-link="https://groupda.com">
      <i class="fa-brands fa-whatsapp"></i>
      WhatsApp Groups Link
    </a>

    <a class="btn telegram" href="javascript:void(0)" data-link="https://groupda.com/telegram">
      <i class="fa-brands fa-telegram"></i>
      Telegram Groups Link
    </a>

  </div>
</div>

<script>
  // Service Worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }

  const AD_LINK =
    "https://www.effectivegatecpm.com/yvc33vhcr?key=392e8fc7e7a5aa8ee592724f8804ce9a";

  // सभी buttons पर click handler
  document.querySelectorAll(".btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();

      const realLink = btn.getAttribute("data-link");
      if (!realLink) return;

      // 1️⃣ पहले Ad
      window.open(AD_LINK, "_blank");

      // 2️⃣ फिर 5 seconds बाद असली link
      setTimeout(() => {
        window.open(realLink, "_blank");
      }, 5000);
    });
  });
</script>

</body>
</html>
