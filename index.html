<html lang="en">
<head>
<meta charset="UTF-8" />

<style>
  *{box-sizing:border-box}

  body{
    margin:0;
    font-family: Inter, Arial, sans-serif;
    background:linear-gradient(180deg,#e8ecff,#f8f9ff);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{
    width:100%;
    padding:18px 0;
    background:#3248f5;
    color:#fff;
    text-align:center;
    font-size:22px;
    font-weight:800;
    letter-spacing:.3px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
  }

  .wrapper{
    width:100%;
    max-width:520px;
    padding:20px 14px 80px;
  }

  .card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-radius:12px;
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    transition:.25s;
  }

  .btn:hover{transform:translateY(-2px) scale(1.01)}
  .btn i{font-size:18px}

  .terabox{background:#5b6bff}
  .instagram{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
  .youtube{background:#ff0000}
  .facebook{background:#1877f2}
  .twitter{background:#000000}
  .tiktok{background:#111}
  .snapchat{background:#fffc00;color:#000}
  .pinterest{background:#e60023}
  .whatsapp{background:#25D366}
  .telegram{background:#229ED9}

  /* ⭐ (NEW) Install Badge styles */
  #promo-badge{
    position:fixed;
    right:14px;
    bottom:18px;
    background:#0f172a;
    color:#fff;
    font-weight:800;
    padding:10px 16px;
    border-radius:999px;
    box-shadow:0 18px 28px rgba(0,0,0,.28);
    cursor:pointer;
    z-index:9999;
    display:none; /* default hidden */
    animation:badgeBounce 2s infinite;
  }
  #promo-badge:hover{
    transform:translateY(-2px) scale(1.04);
  }
  @keyframes badgeBounce{
    0%,100%{transform:translateY(0) scale(1)}
    40%{transform:translateY(-5px) scale(1.03)}
    70%{transform:translateY(0) scale(1)}
  }
</style>
</head>

<body>

<header>Desisavar</header>

<div class="wrapper">

<!-- ⭐ (NEW) Install badge -->
<div id="promo-badge">
  📲 Install Desisaver App
</div>

<script>
  // Service worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }

  const AD_LINK =
    "https://www.effectivegatecpm.com/yvc33vhcr?key=392e8fc7e7a5aa8ee592724f8804ce9a";

  const today = new Date().toDateString();
  const lastUnlock = localStorage.getItem("desisavar_unlock_date");

  let adShown = lastUnlock === today;

  function isOffline() {
    return !navigator.onLine;
  }

  function showAdOnce() {
    if (adShown) return;
    if (isOffline()) return;

    adShown = true;
    localStorage.setItem("desisavar_unlock_date", today);

    // 👇 सिर्फ एक बार ad
    window.open(AD_LINK, "_blank");
  }

  // 👉 page पर किसी भी click पर — सिर्फ पहली बार Ad
  document.addEventListener(
    "click",
    () => {
      showAdOnce();
    },
    { capture: true }
  );

  /* ⭐ (NEW) Install badge logic */
  const badge = document.getElementById("promo-badge");
  let deferredPrompt = null;

  // hide if already installed
  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  if (isStandalone) {
    badge.style.display = "none";
  }

  // when install available
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    badge.style.display = "flex";
  });

  // badge click → install popup
  badge.addEventListener("click", async () => {
    if (!deferredPrompt) {
      alert("Install ke liye: Menu (⋮) → Add to Home Screen");
      return;
    }

    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;

    if (result.outcome === "accepted") {
      badge.style.display = "none";
    }

    deferredPrompt = null;
  });
</script>

</body>
