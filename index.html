<style>

/* Ad Containers */
.ad-slot {

}

#comboBadge{
position:fixed;
right:14px;
bottom:18px;
width:60px;
height:60px;

background:linear-gradient(45deg,#3248f5,#6d28ff,#22c55e);

display:flex;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
z-index:9999;
box-shadow:0 0 25px rgba(109,40,255,.6);
animation:comboGlow 2s infinite;
}
@keyframes comboGlow{
0%{transform:scale(1)}
50%{transform:scale(1.1)}

<script>
/* ===== Delayed Ads Loading (5 Seconds) ===== */
setTimeout(() => {
    // Load First Ad (Iframe format)
    const adTop = document.getElementById('ad-top');
    window.atOptions = {
        'key' : '36ffe368e4b924f77be468053af7bb35',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
    };
    const script1 = document.createElement('script');
    script1.src = "https://yawncollaremotion.com/36ffe368e4b924f77be468053af7bb35/invoke.js";
    adTop.appendChild(script1);

    // Load Second Ad (Container format)
    const adBottom = document.getElementById('ad-bottom');
    const adDiv = document.createElement('div');
    adDiv.id = "container-546f6bc9178f50dbe958ddc959944152";
    adBottom.appendChild(adDiv);

    const script2 = document.createElement('script');
    script2.async = true;
    script2.dataset.cfasync = "false";
    script2.src = "https://yawncollaremotion.com/546f6bc9178f50dbe958ddc959944152/invoke.js";
    adBottom.appendChild(script2);
}, 5000);

/* ===== PWA and OneSignal Scripts ===== */
if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("/sw.js");
}

const combo=document.getElementById("comboBadge");
const icon=document.getElementById("comboIcon");
let deferredPrompt=null;

const isStandalone=
window.matchMedia("(display-mode: standalone)").matches||
window.navigator.standalone===true;

icon.className=isStandalone
?"fa-solid fa-share-nodes"
:"fa-solid fa-download";

window.addEventListener("beforeinstallprompt",(e)=>{
e.preventDefault();
deferredPrompt=e;
});

combo.addEventListener("click",async()=>{
if(isStandalone){
const text=encodeURIComponent(
"🚀 Install Desisaver App\nAll-in-one Video Downloader\n\nDownload now:\nhttps://shorturl.at/qfsIm"
);
window.open(`https://wa.me/?text=${text}`,"_blank");
return;
}
if(!deferredPrompt){
alert("Install ke liye: Menu (⋮) → Add to Home Screen");
return;
}
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt=null;
});

setTimeout(()=>{
if(Notification.permission==="default"){
OneSignalDeferred.push(async function(OneSignal){
await OneSignal.Notifications.requestPermission();
});
}
},7000); // Thoda aur delay taki ads aur notifications clash na karein
</script>
