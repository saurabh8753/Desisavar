<script>

deferredPrompt=e;
});

}
if(!deferredPrompt){
alert("Install ke liye: Menu (⋮) → Add to Home Screen");
return;
}
fetch(TRACK_API + "install").catch(()=>{});
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt=null;
});

if(Notification.permission==="default"){

await OneSignal.Notifications.requestPermission();

},7000);
