<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Video Downloader</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  *{box-sizing:border-box}

  body{
    margin:0;
    font-family: Inter, Arial, sans-serif;
    background:linear-gradient(180deg,#e8ecff,#f8f9ff);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{
    width:100%;
    padding:18px 0;
    background:#3248f5;
    color:#fff;
    text-align:center;
    font-size:22px;
    font-weight:800;
    letter-spacing:.3px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
  }

  .wrapper{
    width:100%;
    max-width:520px;
    padding:20px 14px 60px;
  }

  .card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-radius:12px;
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    position:relative;
    overflow:hidden;
    transition:.25s;
  }

  .btn i{
    font-size:18px;
  }

  .btn::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:12px;
    box-shadow:0 0 0 0 rgba(255,255,255,.6);
    opacity:0;
    transition:.35s ease;
  }

  .btn:hover{
    transform:translateY(-2px) scale(1.01);
  }

  .btn:hover::after{
    opacity:1;
    box-shadow:0 0 18px 4px rgba(255,255,255,.7);
  }

  /* Colors per platform */
  .terabox{background:#5b6bff}
  .instagram{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
  .youtube{background:#ff0000}
  .facebook{background:#1877f2}
  .twitter{background:#000000}
  .tiktok{background:#111}
  .snapchat{background:#fffc00;color:#000}
  .pinterest{background:#e60023}
  .likee{background:linear-gradient(45deg,#ff512f,#dd2476)}
  .vimeo{background:#1ab7ea}

</style>
</head>

<body>

<header>All Video Downloader</header>

<div class="wrapper">
  <div class="card">

    <a class="btn terabox" href="https://example.com/terabox" target="_blank">
      <i class="fa-solid fa-cloud-arrow-down"></i>
      Terabox Downloader
    </a>

    <a class="btn instagram" href="https://example.com/instagram" target="_blank">
      <i class="fa-brands fa-instagram"></i>
      Instagram Downloader
    </a>

    <a class="btn youtube" href="https://example.com/youtube" target="_blank">
      <i class="fa-brands fa-youtube"></i>
      YouTube Downloader
    </a>

    <a class="btn facebook" href="https://example.com/facebook" target="_blank">
      <i class="fa-brands fa-facebook-f"></i>
      Facebook Downloader
    </a>

    <a class="btn twitter" href="https://example.com/twitter" target="_blank">
      <i class="fa-brands fa-x-twitter"></i>
      Twitter (X) Downloader
    </a>

    <a class="btn tiktok" href="https://example.com/tiktok" target="_blank">
      <i class="fa-brands fa-tiktok"></i>
      TikTok Downloader
    </a>

    <a class="btn snapchat" href="https://example.com/snapchat" target="_blank">
      <i class="fa-brands fa-snapchat"></i>
      Snapchat Downloader
    </a>

    <a class="btn pinterest" href="https://example.com/pinterest" target="_blank">
      <i class="fa-brands fa-pinterest"></i>
      Pinterest Downloader
    </a>

    <a class="btn likee" href="https://example.com/likee" target="_blank">
      <i class="fa-solid fa-heart"></i>
      Likee Downloader
    </a>

    <a class="btn vimeo" href="https://example.com/vimeo" target="_blank">
      <i class="fa-brands fa-vimeo-v"></i>
      Vimeo Downloader
    </a>

  </div>
</div>

</body>
</html>
