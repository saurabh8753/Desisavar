<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terabox Video Downloader</title>

<style>
  body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#fff;
    margin:0;
    padding:20px;
  }
  h1{
    text-align:center;
  }
  .btn{
    display:block;
    width:100%;
    max-width:320px;
    margin:10px auto;
    padding:12px 18px;
    background:#3b82f6;
    border:none;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    cursor:pointer;
  }
  .btn:hover{
    background:#2563eb;
  }
</style>
</head>

<body>

<h1>Terabox Video Downloader</h1>

<button class="btn" onclick="alert('Downloader 1 open karein!')">
  Terabox Downloader 1
</button>

<button class="btn" onclick="alert('Downloader 2 open karein!')">
  Terabox Downloader 2
</button>

<button class="btn" onclick="addDownloader()">
  ➕ Add Downloader Button
</button>

<script>
function addDownloader() {
  const name = prompt("New Downloader ka naam likho:");
  if (!name) return;

  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = name;
  btn.onclick = () => alert(name + " open karein!");

  document.body.appendChild(btn);
}
</script>

</body>
</html>
