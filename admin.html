<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Desisaver Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.container{
  width:100%;
  max-width:500px;
}
.card{
  background:#1e293b;
  padding:20px;
  border-radius:14px;
  margin-bottom:15px;
}
h2{
  margin:0 0 10px;
  color:#38bdf8;
}
.stat{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Today</h2>
<div class="stat">Visit <span id="tVisit">0</span></div>
<div class="stat">Install <span id="tInstall">0</span></div>
<div class="stat">Share <span id="tShare">0</span></div>
</div>

<div class="card">
<h2>This Week</h2>
<div class="stat">Visit <span id="wVisit">0</span></div>
<div class="stat">Install <span id="wInstall">0</span></div>
<div class="stat">Share <span id="wShare">0</span></div>
</div>

<div class="card">
<h2>All Time</h2>
<div class="stat">Visit <span id="aVisit">0</span></div>
<div class="stat">Install <span id="aInstall">0</span></div>
<div class="stat">Share <span id="aShare">0</span></div>
</div>

</div>

<script>
const API = "https://admin.yaartunah.workers.dev/?action=stats";

function loadStats(){
  fetch(API,{
    method:"GET",
    mode:"cors",
    cache:"no-store"
  })
  .then(res => res.json())
  .then(data => {

    // TODAY
    document.getElementById("tVisit").innerText = data.today.visit;
    document.getElementById("tInstall").innerText = data.today.install;
    document.getElementById("tShare").innerText = data.today.share;

    // WEEK
    document.getElementById("wVisit").innerText = data.week.visit;
    document.getElementById("wInstall").innerText = data.week.install;
    document.getElementById("wShare").innerText = data.week.share;

    // ALL TIME
    document.getElementById("aVisit").innerText = data.allTime.visit;
    document.getElementById("aInstall").innerText = data.allTime.install;
    document.getElementById("aShare").innerText = data.allTime.share;

  })
  .catch(err=>{
    console.log("Fetch Error:",err);
  });
}

loadStats();
setInterval(loadStats,5000);
</script>

</body>
</html>
