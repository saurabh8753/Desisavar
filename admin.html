<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desisaver Analytics</title>

<meta http-equiv="Cache-Control" content="no-store" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:550px;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.card h2{
  margin:0 0 12px;
  color:#38bdf8;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:10px 12px;
  background:#334155;
  border-radius:8px;
  margin-bottom:8px;
  font-weight:600;
}

.footer{
  text-align:center;
  font-size:12px;
  opacity:.6;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 ZTERA Analytics</h1>

<div class="card">
  <h2>Today</h2>
  <div class="stat">Visits <span id="tVisit">0</span></div>
  <div class="stat">Installs <span id="tInstall">0</span></div>
  <div class="stat">Shares <span id="tShare">0</span></div>
</div>

<div class="card">
  <h2>This Week</h2>
  <div class="stat">Visits <span id="wVisit">0</span></div>
  <div class="stat">Installs <span id="wInstall">0</span></div>
  <div class="stat">Shares <span id="wShare">0</span></div>
</div>

<div class="card">
  <h2>All Time</h2>
  <div class="stat">Visits <span id="aVisit">0</span></div>
  <div class="stat">Installs <span id="aInstall">0</span></div>
  <div class="stat">Shares <span id="aShare">0</span></div>
</div>

<div class="footer">
Auto refresh every 5 seconds
</div>

</div>

<script>
const API = "https://admin.yaartunah.workers.dev/?action=stats";

/* 🔥 Disable service worker for admin */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations()
  .then(regs => regs.forEach(r => r.unregister()));
}

async function loadStats(){
  try{
    const response = await fetch(API, {
      method: "GET",
      mode: "cors",
      cache: "no-store"
    });

    const data = await response.json();

    console.log("Stats:", data);

    // TODAY
    document.getElementById("tVisit").textContent = data.today.visit;
    document.getElementById("tInstall").textContent = data.today.install;
    document.getElementById("tShare").textContent = data.today.share;

    // WEEK
    document.getElementById("wVisit").textContent = data.week.visit;
    document.getElementById("wInstall").textContent = data.week.install;
    document.getElementById("wShare").textContent = data.week.share;

    // ALL TIME
    document.getElementById("aVisit").textContent = data.allTime.visit;
    document.getElementById("aInstall").textContent = data.allTime.install;
    document.getElementById("aShare").textContent = data.allTime.share;

  } catch (error) {
    console.log("Fetch error:", error);
  }
}

loadStats();
setInterval(loadStats, 5000);
</script>

</body>
</html>
