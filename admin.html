<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Desisavar Today Analytics</title>
<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.panel{
width:420px;
background:#1e293b;
padding:25px;
border-radius:16px;
box-shadow:0 0 40px rgba(0,0,0,.6);
}
h2{text-align:center;margin-bottom:15px}
.date{
text-align:center;
margin-bottom:20px;
color:#94a3b8;
}
.stat{
background:#334155;
padding:18px;
border-radius:12px;
margin-bottom:15px;
font-size:18px;
display:flex;
justify-content:space-between;
}
</style>
</head>

<body>

<div class="panel">
<h2>📊 Today Analytics</h2>
<div class="date" id="date"></div>

<div class="stat">
<span>Today's Visits</span>
<span id="visit">Loading...</span>
</div>

<div class="stat">
<span>Today's Install Clicks</span>
<span id="install">Loading...</span>
</div>

<div class="stat">
<span>Today's Share Clicks</span>
<span id="share">Loading...</span>
</div>

</div>

<script>
const WORKER="https://admin.yaartunah.workers.dev/?action=stats";

async function loadStats(){
  const res=await fetch(WORKER);
  const data=await res.json();

  document.getElementById("date").innerText = data.date;
  document.getElementById("visit").innerText = data.visit;
  document.getElementById("install").innerText = data.install;
  document.getElementById("share").innerText = data.share;
}

loadStats();
setInterval(loadStats,5000);
</script>

</body>
</html>
