<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Video Downloader</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:linear-gradient(135deg,#4f46e5,#9333ea,#ec4899);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
}

.container{
width:95%;
max-width:500px;
background:#ffffff10;
backdrop-filter:blur(10px);
border-radius:15px;
padding:25px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,0.2);
}

h1{
margin-bottom:20px;
font-size:24px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
margin-bottom:15px;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#fff;
color:#333;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#eee;
}

.loader{
margin-top:20px;
display:none;
}

.result{
margin-top:20px;
display:none;
}

.result img{
width:100%;
border-radius:10px;
margin-bottom:15px;
}

.download{
display:block;
background:#22c55e;
padding:12px;
border-radius:10px;
color:white;
text-decoration:none;
font-weight:bold;
}

.download:hover{
background:#16a34a;
}

</style>
</head>

<body>

<div class="container">

<h1><i class="fa-brands fa-instagram"></i> Instagram Downloader</h1>

<input type="text" id="url" placeholder="Paste Instagram Reel / Post Link">

<button onclick="downloadVideo()">
<i class="fa-solid fa-download"></i> Get Video
</button>

<div class="loader" id="loader">
<i class="fa fa-spinner fa-spin"></i> Fetching Video...
</div>

<div class="result" id="result">
<img id="thumb">
<a id="downloadBtn" class="download">
<i class="fa fa-download"></i> Download Video
</a>
</div>

</div>

<script>

async function downloadVideo(){

let url=document.getElementById("url").value;

if(!url){
alert("Paste Instagram Link");
return;
}

document.getElementById("loader").style.display="block";
document.getElementById("result").style.display="none";

let api="https://universaldownloader-zeta.vercel.app/api/meta/download?url="+encodeURIComponent(url);

try{

let res=await fetch(api);
let data=await res.json();

if(data.success){

let video=data.data.data[0].url;
let thumb=data.data.data[0].thumbnail;

document.getElementById("thumb").src=thumb;
document.getElementById("downloadBtn").href=video;

document.getElementById("result").style.display="block";

}else{

alert("Video fetch failed");

}

}catch(e){

alert("Error loading video");

}

document.getElementById("loader").style.display="none";

}

</script>

</body>
</html>
