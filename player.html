<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Video Downloader</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background: linear-gradient(135deg,#4f46e5,#ec4899);
  color:white;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
  text-align:center;
}

h1{
  margin-top:40px;
  font-size:28px;
}

p{
  opacity:0.9;
  margin-bottom:25px;
}

.input-box{
  background:white;
  border-radius:12px;
  display:flex;
  padding:8px;
}

.input-box input{
  flex:1;
  border:none;
  outline:none;
  font-size:14px;
  padding:10px;
}

.input-box button{
  background:#e9d5ff;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
}

.download-btn{
  width:100%;
  margin-top:15px;
  background:#16a34a;
  color:white;
  border:none;
  padding:14px;
  font-size:16px;
  border-radius:12px;
  cursor:pointer;
}

.download-btn:disabled{
  opacity:0.6;
}

.result{
  margin-top:25px;
}

.card{
  background:white;
  color:black;
  border-radius:12px;
  padding:12px;
  margin-top:15px;
}

video,img{
  width:100%;
  border-radius:10px;
}

a{
  display:block;
  margin-top:8px;
  text-decoration:none;
  color:#16a34a;
  font-weight:bold;
}

.error{
  margin-top:15px;
  color:#ffe4e6;
}
.loader{
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>Instagram Video Downloader</h1>
<p>Download Instagram Videos, Reels & Photos easily</p>

<div class="input-box">
  <input type="text" id="url" placeholder="Paste Instagram URL">
  <button onclick="paste()">Paste</button>
</div>

<button class="download-btn" id="btn" onclick="download()">
  ⬇ Download
</button>

<div class="loader" id="loader"></div>
<div class="error" id="error"></div>
<div class="result" id="result"></div>

</div>

<script>

function paste(){
  navigator.clipboard.readText()
    .then(text => {
      document.getElementById("url").value = text;
    });
}

async function download(){

  const btn=document.getElementById("btn");
  const url=document.getElementById("url").value.trim();
  const loader=document.getElementById("loader");
  const error=document.getElementById("error");
  const result=document.getElementById("result");

  error.innerText="";
  result.innerHTML="";
  loader.innerText="Processing...";
  btn.disabled=true;

  if(!url.includes("instagram")){
    loader.innerText="";
    btn.disabled=false;
    error.innerText="Please enter a valid Instagram URL";
    return;
  }

  try{

    const res=await fetch("https://alldown.yaartunah.workers.dev/",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({video_url:url})
    });

    const data=await res.json();

    loader.innerText="";
    btn.disabled=false;

    if(!data.success){
      error.innerText=data.message || "Download failed";
      return;
    }

    const items=data.data || data.message?.data;

    if(!items || !items.length){
      error.innerText="No media found";
      return;
    }

    items.forEach(item=>{

      const card=document.createElement("div");
      card.className="card";

      card.innerHTML=`
        ${item.url.includes(".mp4")
          ? `<video src="${item.url}" controls></video>`
          : `<img src="${item.url}">`
        }
        <a href="${item.url}" target="_blank">
          ⬇ Download
        </a>
      `;

      result.appendChild(card);
    });

  }catch(e){
    loader.innerText="";
    btn.disabled=false;
    error.innerText="Server error";
  }
}

</script>

</body>
</html>
