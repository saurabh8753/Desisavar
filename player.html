<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Platform PRO Downloader</title>

<style>
body{
  background:#0f172a;
  font-family:Arial;
  color:white;
  padding:20px;
}
.container{
  max-width:600px;
  margin:auto;
}
h2{
  text-align:center;
}
input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  margin:15px 0;
}
button{
  width:100%;
  padding:14px;
  background:#ff3b5c;
  border:none;
  border-radius:10px;
  color:white;
  font-size:16px;
  cursor:pointer;
}
button:disabled{
  opacity:0.6;
}
.card{
  background:#1e293b;
  padding:12px;
  border-radius:12px;
  margin-top:20px;
}
video,img{
  width:100%;
  border-radius:10px;
}
a{
  display:block;
  margin-top:8px;
  color:#22c55e;
  font-weight:bold;
}
.error{
  color:#ff4d4d;
  text-align:center;
  margin-top:15px;
}
.loader{
  text-align:center;
  margin-top:15px;
}
</style>
</head>
<body>

<div class="container">

<h2>Multi-Platform PRO Downloader</h2>

<input type="text" id="url" placeholder="Paste Instagram / YouTube / Facebook URL">

<button id="btn" onclick="download()">Download</button>

<div class="loader" id="loader"></div>
<div class="error" id="error"></div>
<div id="result"></div>

</div>

<script>

async function download(){

  const btn = document.getElementById("btn");
  const url = document.getElementById("url").value.trim();
  const loader = document.getElementById("loader");
  const error = document.getElementById("error");
  const result = document.getElementById("result");

  error.innerText="";
  result.innerHTML="";
  loader.innerText="Processing...";
  btn.disabled=true;

  try{

    const res = await fetch("https://alldown.yaartunah.workers.dev/",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ video_url:url })
    });

    const data = await res.json();
    loader.innerText="";
    btn.disabled=false;

    if(data.success===1){

      const items = data.data || data.message?.data;

      items.forEach((item,i)=>{

        const card = document.createElement("div");
        card.className="card";

        if(item.type==="video" || item.url.includes(".mp4")){
          card.innerHTML=`
            <video src="${item.url}" controls></video>
            <a href="${item.url}" target="_blank">
            ⬇ Download Video</a>
          `;
        }else{
          card.innerHTML=`
            <img src="${item.url}">
            <a href="${item.url}" target="_blank">
            ⬇ Download Image</a>
          `;
        }

        result.appendChild(card);
      });

    }else{
      error.innerText=data.message || "Download failed";
    }

  }catch(e){
    loader.innerText="";
    btn.disabled=false;
    error.innerText="Worker error";
  }
}

</script>

</body>
</html>
